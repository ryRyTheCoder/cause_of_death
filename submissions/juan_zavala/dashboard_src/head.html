<title>Nashville Cemetery Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive dashboard of 19,670 burials in the Nashville City Cemetery interment ledger, 1846-1979: spikes, causes, age groups and the Civil War years.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ledger page. A header with the headline numbers, a sticky filter rail,
   the year chart across the full width, paired panels below, and the reading notes last. */
:root {
  --page: #f3f3f0;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --rule: rgba(11, 11, 11, 0.10);
  --accent: #1c5cab;
  --accent-wash: #e6effb;
  --bar: #86b6ef;
  --spike: #eb6834;
  --spike-text: #b4471c;
  --vague: #c9c7bf;
  --band: rgba(11, 11, 11, 0.05);
  --brush: rgba(28, 92, 171, 0.10);
  --age-0: #86b6ef; --age-1: #5598e7; --age-2: #2a78d6; --age-3: #1c5cab; --age-4: #104281; --age-5: #c9c7bf;
  --heat-0: #f4f8fe; --heat-1: #cde2fb; --heat-2: #86b6ef; --heat-3: #2a78d6; --heat-4: #184f95;
  --p-before: #86b6ef; --p-war: #eb6834; --p-after: #1c5cab;
  --tip-bg: #0b0b0b; --tip-fg: #f0efec;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.06);
  --display: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a978f;
    --grid: #2c2c2a; --axis: #383835; --rule: rgba(255, 255, 255, 0.10);
    --accent: #6da7ec; --accent-wash: #16273d; --bar: #256abf; --spike: #d95926; --spike-text: #f08a5d;
    --vague: #6b6a65; --band: rgba(255, 255, 255, 0.06); --brush: rgba(109, 167, 236, 0.14);
    --age-0: #184f95; --age-1: #256abf; --age-2: #3987e5; --age-3: #6da7ec; --age-4: #9ec5f4; --age-5: #6b6a65;
    --heat-0: #1e2430; --heat-1: #1c3a63; --heat-2: #256abf; --heat-3: #6da7ec; --heat-4: #cde2fb;
    --p-before: #256abf; --p-war: #d95926; --p-after: #9ec5f4;
    --tip-bg: #f0efec; --tip-fg: #0b0b0b; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a978f;
  --grid: #2c2c2a; --axis: #383835; --rule: rgba(255, 255, 255, 0.10);
  --accent: #6da7ec; --accent-wash: #16273d; --bar: #256abf; --spike: #d95926; --spike-text: #f08a5d;
  --vague: #6b6a65; --band: rgba(255, 255, 255, 0.06); --brush: rgba(109, 167, 236, 0.14);
  --age-0: #184f95; --age-1: #256abf; --age-2: #3987e5; --age-3: #6da7ec; --age-4: #9ec5f4; --age-5: #6b6a65;
  --heat-0: #1e2430; --heat-1: #1c3a63; --heat-2: #256abf; --heat-3: #6da7ec; --heat-4: #cde2fb;
  --p-before: #256abf; --p-war: #d95926; --p-after: #9ec5f4;
  --tip-bg: #f0efec; --tip-fg: #0b0b0b; --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
  font-variation-settings: "wdth" 100;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--page);
}
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.masthead { padding-block: 32px 20px; display: grid; gap: 20px; }
.eyebrow {
  margin: 0; font: 500 12px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
h1 {
  margin: 4px 0 0; font-family: var(--display); font-weight: 760; font-stretch: 78%;
  font-variation-settings: "wdth" 78; font-size: clamp(30px, 5.2vw, 56px); line-height: 1.02;
  letter-spacing: -0.01em; text-wrap: balance;
}
.lede { margin: 10px 0 0; max-width: 64ch; color: var(--ink-2); font-size: 16px; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px 15px; min-width: 0; }
.kpi .label { font-size: 12.5px; color: var(--ink-2); font-weight: 560; }
.kpi .value { font-family: var(--display); font-variation-settings: "wdth" 86; font-stretch: 86%;
  font-weight: 720; font-size: clamp(26px, 3.3vw, 36px); line-height: 1.1; margin-top: 4px; }
.kpi .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ---------- filter rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--page);
  background: color-mix(in srgb, var(--page) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(8px); -webkit-backdrop-filter: saturate(1.2) blur(8px);
  border-block: 1px solid var(--rule);
}
.rail .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span, .field > legend { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; }
.years { display: flex; align-items: center; gap: 6px; }
.years input {
  width: 4.6em; padding: 6px 6px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface);
  font-variant-numeric: tabular-nums;
}
select {
  padding: 6px 9px; border: 1px solid var(--rule); border-radius: 7px; background-color: var(--surface);
  max-width: 15em;
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 10px;
  font-size: 13px; cursor: pointer; line-height: 1.35; display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.presets .chip { font-size: 12.5px; }
.btn-reset {
  border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 2px; text-decoration: underline;
  text-underline-offset: 3px;
}
.active-cause { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- panels ---------- */
main { display: grid; gap: 18px; padding-block: 18px 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.panel {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px 14px;
  min-width: 0; box-shadow: var(--shadow); display: grid; gap: 10px; align-content: start;
}
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 6px 14px; }
.panel h2 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 680; text-wrap: balance; }
.panel .q { font: 500 11.5px/1.3 var(--mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 3px; }
.panel .sub { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 70ch; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--rule); }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 2px; width: 14px; border-radius: 0; vertical-align: 3px; background: var(--ink); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.empty { padding: 28px 0; text-align: center; color: var(--muted); font-size: 14px; }

svg text { font-family: var(--body); }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.lbl { fill: var(--ink-2); font-size: 11.5px; }
.lbl-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
.spike-lbl { fill: var(--spike-text); font-size: 11.5px; font-weight: 650; }
.band-lbl { fill: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; }
.heat-row:focus { outline: none; }
.heat-row:focus-visible .lbl-strong { fill: var(--accent); text-decoration: underline; }

/* causes */
.causes { display: grid; gap: 6px; }
.cause-row {
  display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) auto; gap: 10px; align-items: center;
  border: 0; background: none; text-align: left; padding: 3px 4px; border-radius: 6px; cursor: pointer; width: 100%;
}
.cause-row:hover { background: var(--accent-wash); }
.cause-row[aria-pressed="true"] { background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent); }
.cause-name { font-size: 13.5px; line-height: 1.25; overflow-wrap: anywhere; }
.cause-name small { color: var(--muted); font-size: 11.5px; }
.track { height: 14px; position: relative; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--age-2); border-radius: 0 4px 4px 0; min-width: 2px; }
.fill.vague { background: var(--vague); }
.cause-val { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* small multiples */
.multiples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
.mult h3 { margin: 0 0 2px; font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.mult h3 .sw { width: 9px; height: 9px; border-radius: 2px; }
.mult p { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* tables */
details.numbers { border-top: 1px solid var(--rule); padding-top: 8px; }
details.numbers summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; width: fit-content; }
.table-scroll { overflow-x: auto; max-height: 340px; overflow-y: auto; margin-top: 8px; }
table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { padding: 5px 9px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; }
td.mono { font-family: var(--mono); font-size: 12px; }

.heat-scroll { overflow-x: auto; }

/* notes */
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 22px; }
.notes h3 { margin: 0 0 3px; font-size: 14px; font-weight: 680; }
.notes p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.notes code, .foot code { font-family: var(--mono); font-size: 12px; background: var(--page); padding: 1px 4px; border-radius: 4px; }
.foot { padding-block: 18px 40px; color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; }

/* tooltip */
.tip {
  position: fixed; z-index: 50; pointer-events: none; max-width: 280px;
  background: var(--tip-bg); color: var(--tip-fg); border-radius: 8px; padding: 8px 10px;
  font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
}
.tip b { font-weight: 650; }
.tip .t-sub { opacity: 0.78; }

@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row { grid-template-columns: minmax(0, 1fr); }
  .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .masthead { padding-block: 22px 14px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:last-child { grid-column: 1 / -1; }
  .rail { position: static; }
  .multiples { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .notes { grid-template-columns: minmax(0, 1fr); }
  .cause-row { grid-template-columns: minmax(0, 1fr) auto; }
  .cause-row .track { grid-column: 1 / -1; grid-row: 2; }
  .panel { padding: 14px 14px 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill { transition: width 0.25s ease; }
}
</style>
